
name: Release

on:
  push:
    tags:
      - '*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sourcecode
        uses: actions/checkout@v4

      - name: Setup Java (JDK)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle permissions
        run: chmod +x gradlew

      - name: Get version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#1.21.1-}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi

          echo "mod_version=${VERSION}-1.21.1" >> $GITHUB_OUTPUT

      - name: Build project
        run: |
          ./gradlew build \
            -Pmod_version=${{ steps.version.outputs.mod_version }}

      - name: Verify generated files
        run: ls -lah build/libs/

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.sha) }}
          name: JSG Expansion ${{ steps.version.outputs.mod_version }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            build/libs/*.jar